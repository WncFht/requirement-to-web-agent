name: Compiler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements-dev.txt
      - name: Check document formatting
        run: npm run format:check && npm run lint:md
      - name: Check docs, history and compiler
        env:
          MAINTENANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/run_checks.py --config scripts/checks.json --mode ci
