    - id: SCN-REQ-6.1-01
      name: Open sign-in entry
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: An anonymous visitor is on the homepage.
        When: Activate Sign in in Global navigation.
        Then: Email and masked Password fields, the Sign in submit button and No account? Create one here link are
