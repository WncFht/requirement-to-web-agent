      steps:
      - id: STEP-REQ-4.3-01-01
        Given: |-
          order_read has signed in using ctrip_order_read@example.com / Travel1234 and checked Agree to terms, then opened My account → Orders. Its seeded orders are CTRIP20260721001/JD5162/¥530/Pending payment, CTRIP20260722002/CZ3401/¥390/Not traveled and CTRIP20260718003/MU5234/¥650/Pending review. View details has been clicked within CTRIP20260721001.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"order_read": {"email": "ctrip_order_read@example.com", "password": "Travel1234"}}
          - historical and cancellation orders: [{"owner": "order_read", "number": "CTRIP20260721001", "flight": "JD5162", "date": "2026-07-21", "origin": "Chengdu", "destination": "Guangzhou", "total": 530, "payment_status": "Pending payment", "display_status": "Pending payment"}, {"owner": "order_read", "number": "CTRIP20260722002", "flight": "CZ3401", "date": "2026-07-22", "total": 390, "payment_status": "Paid", "display_status": "Not traveled"}, {"owner": "order_read", "number": "CTRIP20260718003", "flight": "MU5234", "date": "2026-07-18", "total": 650, "payment_status": "Paid", "display_status": "Pending review"}]
        When: Inspect Order details, Flight itinerary and Payment status; record Time remaining and advance browser
          elapsed time by 1.1 seconds.
        Then: The order number, JD5162 and Chengdu to Guangzhou are visible; itinerary offers Refund and change
          rules; Payment status displays Pending payment, expiry reminder, Pay now and Cancel order, and its positive
          Time remaining decreases.
        references:
