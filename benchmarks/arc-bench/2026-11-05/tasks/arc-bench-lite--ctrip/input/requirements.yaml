id: ROOT
name: Ctrip travel services
description:
  text: |-
    A travel services application for account access, flight search and booking, and order management.

    Dates and public countdowns use Asia/Shanghai and the shared application/evaluator clock 2026-07-19T08:00:00+08:00.

    Sessions, current search criteria and booking selections are established by public UI behavior within each scenario, never injected into storage.
scenarios: []
children:
- id: REQ-1
  name: Account access
  description:
    text: Support enter the travel application, open password login, authenticate with password, end authenticated
      session.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Enter the travel application
    description:
      text: Signed-out / displays exactly one Ctrip Travel heading and Log in link in Global navigation (a single
        named navigation landmark), a search box, and Origin and Destination textboxes. Fields have associated labels;
        controls may be buttons or links unless an explicit role is declared. Registration and SMS login are outside
        scope.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show signed-out entry
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Inspect the initial homepage.
        Then: Exactly one Ctrip Travel heading and one Log in link in Global navigation are visible, together with
          the searchbox and Origin and Destination fields.
        references:
        - \ref[image](IMG-INDEX)
    children: []
    dependencies: []
  - id: REQ-1.2
    name: Open password login
    description:
      text: Log in in Global navigation opens a Log in heading, Account and Password fields, an initially unchecked
        Agree to terms checkbox and Log in submit button. Password login is the only required authentication method;
        registration, SMS and login-mode switching are outside scope.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-LOGIN2
        reference: reference/login2.png
        page: login
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Open password login
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Activate Log in within Global navigation.
        Then: Log in heading, Account and Password fields are visible.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-LOGIN2)
    children: []
    dependencies:
    - REQ-1.1
  - id: REQ-1.3
    name: Authenticate with password
    description:
      text: |-
        Users enter a verified mobile, username, or email in "Account"(role=textbox), enter "Password"(role=textbox), select the initially unchecked "Agree to terms"(role=checkbox), and click "Log in"(role=button). Agreement is required. Missing credentials or incorrect credentials show the specified alert without signing in; success returns home and replaces the login entry with "My account"(role=button).

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Authenticate by email
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. ctrip_user@example.com is the verified user account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com and Password Travel1234, check Agree to terms and click Log in.
        Then: Ctrip Travel homepage opens, My account is visible and the signed-out Log in navigation link disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-02
      name: Authenticate by username
      steps:
      - id: STEP-REQ-1.3-02-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. ctrip_user identifies the verified user account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user and Password Travel1234, check Agree to terms and click Log in.
        Then: Ctrip Travel homepage opens, My account is visible and the signed-out Log in navigation link disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-03
      name: Authenticate by mobile
      steps:
      - id: STEP-REQ-1.3-03-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. 13800000010 belongs to the verified user account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account 13800000010 and Password Travel1234, check Agree to terms and click Log in.
        Then: Ctrip Travel homepage opens, My account is visible and the signed-out Log in navigation link disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-04
      name: Reject missing account
      steps:
      - id: STEP-REQ-1.3-04-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Log in has been opened from Global navigation; Agree to terms initially is unchecked.
        When: Leave Account empty, enter Password Travel1234, check Agree to terms and click Log in.
        Then: Enter your account alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-05
      name: Reject missing password
      steps:
      - id: STEP-REQ-1.3-05-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com, leave Password empty, check Agree to terms and click Log in.
        Then: Enter your password alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-06
      name: Reject incorrect password
      steps:
      - id: STEP-REQ-1.3-06-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com and Password WrongPass123, check Agree to terms and click Log
          in.
        Then: Incorrect account or password alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-07
      name: Require legal acceptance
      steps:
      - id: STEP-REQ-1.3-07-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com and Password Travel1234, leave Agree to terms unchecked and click
          Log in.
        Then: Agree to terms first alert appears, the login form remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    children: []
    dependencies:
    - REQ-1.2
  - id: REQ-1.4
    name: End authenticated session
    description:
      text: |-
        Hovering "My account"(role=button) reveals the Log out menuitem. Activating it clears the session and replaces My account with Log in on the signed-out homepage, including after reload.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-ENTER-SELF
        reference: reference/enter_self.png
        page: home
    scenarios:
    - id: SCN-REQ-1.4-01
      name: Log out and retain signed-out state
      steps:
      - id: STEP-REQ-1.4-01-01
        Given: |-
          The verified user has signed in through Account ctrip_user@example.com, Password Travel1234 and checked Agree to terms.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Hover My account, activate Log out (menuitem), then reload.
        Then: Log in returns to Global navigation and My account disappears, both before and after reload.
        references:
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-ENTER-SELF)
    children: []
    dependencies:
    - REQ-1.3
  dependencies: []
- id: REQ-2
  name: Find flights and select a fare
  description:
    text: Support configure trip type, select and exchange route cities, choose valid journey dates, execute matching
      or empty flight search, carry traveler and cabin preferences into search, update results search criteria,
      filter flights by stops and airline, sort matching flights, inspect and collapse fare options, select the
      identified flight and fare, change route criteria on flight results, recover from an empty flight search,
      restore flights after removing nonstop filter, remove airline filter while keeping nonstop preference.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Configure trip type
    description:
      text: |-
        "One way"(role=radio) is initially selected, with "Add return"(role=button) available and "Return date"(role=textbox) absent. Selecting "Round trip"(role=radio) reveals Return date, while returning to One way hides it. "Multi-city"(role=radio) is also available.

        Multi-city is retained as capability context; its detailed behavior is unspecified.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Dates and time-dependent behavior use Asia/Shanghai and the shared application/evaluator time 2026-07-19T08:00:00+08:00; public countdowns use elapsed time.

        Published flight identity includes route, date and dataset. Flight identity includes origin, destination, date and flight number.

        Multi-city, time-filter and airport-filter details are not specified beyond their capability context; the stated trip-type behaviors do not imply additional validation policies.
      image:
      - id: IMG-SEARCH
        reference: reference/search.png
        page: home
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Switch one-way and round-trip modes
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          One way is initially selected.
        When: Inspect Add return and the absent Return date, select Round trip, then select One way again.
        Then: Round trip reveals Return date; One way removes that field and restores Add return; Multi-city remains
          available.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SEARCH)
    children: []
    dependencies: []
  - id: REQ-2.2
    name: Select and exchange route cities
    description:
      text: |-
        "Origin"(role=textbox) and "Destination"(role=textbox) accept cities; "Swap cities"(role=button) exchanges their values without searching. "City selection"(role=button) opens "City selection"(role=dialog), with its "City selection"(role=tab) choices: origin defaults to Popular with Chengdu, while the destination's GHIJ tab includes Guangzhou. Choosing a city closes the dialog and fills the city and airport code.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Dates and time-dependent behavior use Asia/Shanghai and the shared application/evaluator time 2026-07-19T08:00:00+08:00; public countdowns use elapsed time.

        Published flight identity includes route, date and dataset. Flight identity includes origin, destination, date and flight number.
      image:
      - id: IMG-CITY-SELECTION
        reference: reference/city_selection.png
        page: home
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Exchange route cities
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Enter Origin Chengdu and Destination Guangzhou, then click Swap cities.
        Then: Origin becomes Guangzhou and Destination becomes Chengdu.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CITY-SELECTION)
    - id: SCN-REQ-2.2-02
      name: Choose a popular origin
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Click Origin, inspect the selected Popular tab in City selection, then click Chengdu.
        Then: Origin becomes Chengdu (CTU) and City selection closes.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CITY-SELECTION)
    - id: SCN-REQ-2.2-03
      name: Choose destination by pinyin group
      steps:
      - id: STEP-REQ-2.2-03-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Click Destination, select GHIJ within City selection and click Guangzhou.
        Then: Destination becomes Guangzhou (CAN) and City selection closes.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CITY-SELECTION)
    children: []
    dependencies:
    - REQ-1.1
  - id: REQ-2.3
    name: Choose valid journey dates
    description:
      text: |-
        Opening "Departure date"(role=textbox) displays a calendar with daily fares and full-date actions. "2026-07-21"(role=button) shows ¥460 and sets departure before closing; "2026-07-18"(role=button) is disabled because it precedes July 19. "Add return"(role=button) selects "Round trip"(role=radio) and opens "Return date"(role=textbox). Selecting "2026-07-25"(role=button) after July 21 displays a four-day trip, while "2026-07-20"(role=button) is disabled as a return before departure.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Dates and time-dependent behavior use Asia/Shanghai and the shared application/evaluator time 2026-07-19T08:00:00+08:00; public countdowns use elapsed time.

        Published flight identity includes route, date and dataset. Flight identity includes origin, destination, date and flight number.
      image:
      - id: IMG-DATE-SELECTION
        reference: reference/date_selection.png
        page: home
      - id: IMG-DATE-SELECTION-2
        reference: reference/date_selection_2.png
        page: home
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Select a future departure with fare
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Calendar fares include ¥460 for July 21.
          Seed prerequisites (prepared before this scenario):
          - published booking inventory: {"flights": [{"number": "CZ3401", "origin": "Chengdu", "destination": "Guangzhou", "date": "2026-07-21", "airline": "China Southern", "stops": "nonstop", "fare": 320, "departure": "11:00", "on_time": "95%"}, {"number": "JD5162", "origin": "Chengdu", "destination": "Guangzhou", "date": "2026-07-21", "airline": "Other airline", "stops": "stopover", "fare": 460, "departure": "09:00", "on_time": "88%"}, {"number": "MU5234", "origin": "Chengdu", "destination": "Guangzhou", "date": "2026-07-21", "airline": "Other airline", "stops": "nonstop", "fare": 580, "departure": "07:30", "on_time": "91%"}]}
        When: Open Departure date, inspect the fare, then click 2026-07-21.
        Then: ¥460 is displayed; Departure date becomes 2026-07-21 and the date picker closes.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    - id: SCN-REQ-2.3-02
      name: Disable past departure dates
      steps:
      - id: STEP-REQ-2.3-02-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Open Departure date and inspect 2026-07-18.
        Then: That past-date button is visible but disabled.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    - id: SCN-REQ-2.3-03
      name: Add a four-day return trip
      steps:
      - id: STEP-REQ-2.3-03-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Departure date has been selected as 2026-07-21.
        When: Click Add return and select 2026-07-25.
        Then: Round trip is selected, Return date becomes 2026-07-25 and 4 days is displayed.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    - id: SCN-REQ-2.3-04
      name: Disable return before departure
      steps:
      - id: STEP-REQ-2.3-04-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Departure date has been selected as 2026-07-21.
        When: Click Add return and inspect return choice 2026-07-20.
        Then: The earlier return-date button is visible but disabled.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    children: []
    dependencies:
    - REQ-1.1
  - id: REQ-2.4
    name: Execute matching or empty flight search
    description:
      text: |-
        Users fill "Origin"(role=textbox), "Destination"(role=textbox), and "Departure date"(role=textbox), then click "Search flights"(role=button). Flight results preserves criteria and shows "Flight list"(role=region); Chengdu–Guangzhou on July 21 contains exactly CZ3401, JD5162, and MU5234 with published booking inventory fare, airline, stops, departure, and on-time facts. Equal cities show Origin and destination cannot be the same. Beihai–Mars City on July 23 displays No flights found and Modify search.

        Domestic and international route search use benchmark date 2026-07-19. Flight results expose a list with listitems named "Flight <number>".

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Dates and time-dependent behavior use Asia/Shanghai and the shared application/evaluator time 2026-07-19T08:00:00+08:00; public countdowns use elapsed time.

        Published flight identity includes route, date and dataset. Flight identity includes origin, destination, date and flight number.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Show matching published flights
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. published booking inventory contains the three July 21 Chengdu–Guangzhou flights.
          Seed prerequisites (prepared before this scenario):
          - published booking inventory: {"flights": [{"number": "CZ3401", "origin": "Chengdu", "destination": "Guangzhou", "date": "2026-07-21", "airline": "China Southern", "stops": "nonstop", "fare": 320, "departure": "11:00", "on_time": "95%"}, {"number": "JD5162", "origin": "Chengdu", "destination": "Guangzhou", "date": "2026-07-21", "airline": "Other airline", "stops": "stopover", "fare": 460, "departure": "09:00", "on_time": "88%"}, {"number": "MU5234", "origin": "Chengdu", "destination": "Guangzhou", "date": "2026-07-21", "airline": "Other airline", "stops": "nonstop", "fare": 580, "departure": "07:30", "on_time": "91%"}]}
          - city directory: {"Chengdu": {"code": "CTU", "group": "Popular"}, "Guangzhou": {"code": "CAN", "group": "GHIJ"}}
        When: Enter Origin Chengdu and Destination Guangzhou, choose Departure date 2026-07-21 and click Search
          flights.
        Then: Flight results opens with exactly CZ3401, JD5162 and MU5234; Origin, Destination and Departure date
          retain Chengdu, Guangzhou and 2026-07-21.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.4-02
      name: Reject identical cities
      steps:
      - id: STEP-REQ-2.4-02-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Enter Chengdu in both Origin and Destination and click Search flights.
        Then: Origin and destination cannot be the same alert appears; editable search remains and Flight results
          does not open.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.4-03
      name: Show empty route result
      steps:
      - id: STEP-REQ-2.4-03-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. No Beihai–Mars City flight is published for July 23.
          Seed prerequisites (prepared before this scenario):
          - published booking inventory: {"flights": [], "empty_query": {"origin": "Beihai", "destination": "Mars City", "date": "2026-07-23"}}
        When: Enter Origin Beihai and Destination Mars City, select Departure date 2026-07-23 and click Search flights.
        Then: Flight list has no flight listitems and displays No flights found with Modify search.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
    dependencies:
    - REQ-2.2
    - REQ-2.3
  - id: REQ-2.5
    name: Carry traveler and cabin preferences into search
    description:
      text: |-
        Selecting "Traveling with children"(role=checkbox) carries that preference into Flight results as Children included. "Cabin class"(role=combobox) includes Economy and retains the chosen option during search.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Dates and time-dependent behavior use Asia/Shanghai and the shared application/evaluator time 2026-07-19T08:00:00+08:00; public countdowns use elapsed time.

        Published flight identity includes route, date and dataset. Flight identity includes origin, destination, date and flight number.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Search with children included
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Seed prerequisites (prepared before this scenario):
          - published booking inventory: {"flights": []}
        When: Check Traveling with children, then Enter Origin Chengdu and Destination Guangzhou, choose Departure
          date 2026-07-21 and click Search flights.
        Then: Flight results displays Children included.
