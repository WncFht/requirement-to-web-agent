id: ROOT
name: Stack Overflow developer knowledge sharing
description:
  text: |-
    A developer question-and-answer platform for discovering, publishing, answering, commenting on, voting on, and managing questions.

    The application, server and evaluator use the fixed UTC time 2026-07-21T12:02:00Z.

    For public historical question index: Historical metrics cannot be reproduced by a single new UI post. Missing timestamps use 2026-07-15T12:00:00Z. Answered sample questions contain an answer by Helpful User. Only dedicated voting/editing records are mutable; other samples remain public after deletion of any UI-created question.

    For accounts, questions, answers and comments: All ordinary mutable source examples are created through UI within each case. Question titles append the automatically generated worker-run identifier, parallelIndex and case slug; registration email is new_stack_user+<suffix>@example.com. Helpers create a question as the named owner, then answers/comments as the named author in separate authenticated browser contexts. Each case owns its objects.

    For session, edit draft, search and voting: Produced only by public interactions. No storage injection or hidden API. Vote effects are relative to the author current public reputation, which may include other independent case contributions.
scenarios: []
children:
- id: REQ-1
  name: Discover the community
  description:
    text: Support read a public question anonymously.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Read a public question anonymously
    description:
      text: An anonymous visitor can open a published question through the public feed or search and read its title,
        rendered body, tags, and existing answers in "Question post"(role=region). Reading public knowledge requires
        no session; the header continues to offer "Log in"(role=button) and "Sign up"(role=button). This public
        access is independent of the authenticated comment controls in REQ-3.2.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Read without an account
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          The browser has no session and public historical question index includes How can I safely retry an idempotent HTTP request in Node.js? with its body, tags and answers.
          Seed prerequisites (prepared before this scenario):
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
          - public historical question index: {"questions": [{"title": "How can I safely retry an idempotent HTTP request in Node.js?", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["node.js", "http", "retry"], "author": "helpful_user", "score": 7, "answers": 0, "views": 42, "asked": "2026-07-01T12:00:00Z", "modified": "2026-07-10T12:00:00Z"}]}
        When: Open Questions, enter the exact title in banner Search, press Enter and choose that title from Search
          results.
        Then: The public heading, Question post body and node.js/http/retry tags are readable without a login form;
          existing Answers remains readable and the banner still offers Log in and Sign up.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
    dependencies:
    - REQ-3.1
    - REQ-6.1
  dependencies: []
- id: REQ-2
  name: Account access
  description:
    text: Support sign in with email and password, create an account.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Sign in with email and password
    description:
      text: |-
        Clicking "Log in"(role=button) opens "Log in"(role=region) containing "Email"(role=textbox), "Password"(role=textbox), a "Show password"(role=button) toggle, Forgot password? and Sign up entry points. "Show password" reveals the current password without changing its value and becomes "Hide password"(role=button), which restores masking. "Forgot password?"(role=button) remains available as the recovery entry. Submitting valid credentials returns home with "Stack User"(role=button) as the profile action and a session that survives reload. Empty credentials show Email cannot be empty and Password cannot be empty; malformed email shows The email is not a valid email address; an absent account shows No account found with this email; an incorrect password shows The email or password does not match any account. Rejections retain the form and anonymous state.

        Login and Sign up are named form regions with errors visible within each form. Forgot password? is an entry affordance only; recovery, public profile and user catalog flows are outside scope. Seeded accounts, password and display names are declared at task level.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-LOGIN
        reference: reference/login.jpeg
        page: login
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Sign in and retain session
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: |-
          verified accounts contains stack_user@example.com with Password123! and display name Stack User; the browser is anonymous.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
        When: Open Log in from the banner, enter the account Email and Password, submit Log in, and reload the returned
          homepage.
        Then: Question feed appears; after reload the banner still exposes Stack User and no Log in action, demonstrating
          a retained session.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-02
      name: Reject empty credentials
      steps:
      - id: STEP-REQ-2.1-02-01
        Given: The anonymous Log in region is open with Email and Password both empty.
        When: Click Log in inside that form without entering credentials.
        Then: Email cannot be empty and Password cannot be empty are visible within the retained form; the banner
          remains anonymous and no account profile action appears.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-03
      name: Reject malformed email
      steps:
      - id: STEP-REQ-2.1-03-01
        Given: The anonymous Log in region is open.
        When: Enter invalid-email-format in Email and Password123! in Password, then submit Log in.
        Then: The email is not a valid email address appears in the retained form and no Stack User profile action
          appears.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-04
      name: Reject unknown account
      steps:
      - id: STEP-REQ-2.1-04-01
        Given: The anonymous Log in form is open; unknown_user@example.com does not exist in the initial account
          world.
        When: Fill Email with unknown_user@example.com and Password with Password123!, then submit Log in.
        Then: No account found with this email appears in the retained form; no Stack User profile action appears
          and the browser remains anonymous.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-05
      name: Reject wrong password
      steps:
      - id: STEP-REQ-2.1-05-01
        Given: |-
          The anonymous Log in form is open and stack_user@example.com exists with Password123!.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
        When: Enter that email and WrongPassword123!, then submit Log in.
        Then: The email or password does not match any account appears in the retained form; the account profile
          action is absent.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-06
      name: Toggle password visibility
      steps:
      - id: STEP-REQ-2.1-06-01
        Given: The anonymous Log in form is open with its Forgot password? and Sign up entries available; Password
          starts masked.
        When: Enter Password123!, click Show password, inspect the field, then click Hide password and inspect again.
        Then: Password becomes readable and then masked again without changing Password123!; recovery and signup
          entries remain available throughout the form.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    children: []
    dependencies: []
  - id: REQ-2.2
    name: Create an account
    description:
      text: |-
        Clicking "Sign up"(role=button) opens "Sign up"(role=region) with Join Stack Overflow heading, "Email"(role=textbox), "Password"(role=textbox), password help, consent text, and a Log in entry. Submitting a unique valid email and password creates the account and signs it in automatically, exposing "<registered email>"(role=button) as the profile action when no display name was entered. An existing email shows Email is already in use; a short password shows visible requirements including a minimum of eight characters. Rejections retain the form without an authenticated session. Registration emails use deterministic run, worker, and case suffixes; verification is not added.

        Login and Sign up each expose a named form region and submit button. Form errors are visible within their form. Social login and SSO are excluded.

        Login and Sign up each expose a named form region and submit button, with errors visible inside the corresponding form. Public profile is a named region. Profile actions in the user catalog combine display name and email to distinguish identical display names; unavailable unauthorized actions may be absent or disabled.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-SIGN-UP
        reference: reference/sign-up.jpeg
        page: signup
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Register and automatically sign in
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: A fresh anonymous browser uses an unused new_stack_user email containing the evaluator's deterministic
          case suffix; Password123! satisfies the declared password rule.
        When: Open Sign up from the banner, inspect Join Stack Overflow and terms/privacy text, fill Email with
          the isolated email and Password with Password123!, then submit Sign up.
        Then: The banner exposes that exact registered email as the profile action and Question feed appears, confirming
          account creation and automatic authentication.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    - id: SCN-REQ-2.2-02
      name: Reject duplicate email
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: |-
          The anonymous Sign up form is open and verified accounts already contains stack_user@example.com.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
        When: Enter stack_user@example.com and Password123! and submit Sign up.
        Then: Email is already in use appears within the retained form; Stack User is absent from the banner and
          no authenticated session is created.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    - id: SCN-REQ-2.2-03
      name: Reject weak password
      steps:
      - id: STEP-REQ-2.2-03-01
        Given: The anonymous Sign up form is open with an unused weak_password_candidate email using the deterministic
          case suffix.
        When: Enter the unused email and short as Password, then submit Sign up.
        Then: The form visibly explains the minimum eight-character requirement and stays open; the proposed email
          profile action is absent and registration does not authenticate.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    children: []
    dependencies: []
  dependencies: []
- id: REQ-3
  name: Publish and maintain questions capability
  description:
    text: Support open public Questions listing, read question detail, publish a question, revise a question, delete
      an eligible own question, toggle question upvote, protect question deletion by ownership.
  scenarios: []
  children:
  - id: REQ-3.1
    name: Open public Questions listing
    description:
      text: Follow Questions in Main navigation. Question feed exposes Ask Question and published question summaries.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Open public Questions listing
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          A visitor is on the populated public homepage.
          Seed prerequisites (prepared before this scenario):
          - public historical question index: {"questions": [{"title": "How can I safely retry an idempotent HTTP request in Node.js?", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["node.js", "http", "retry"], "author": "helpful_user", "score": 7, "answers": 0, "views": 42, "asked": "2026-07-01T12:00:00Z", "modified": "2026-07-10T12:00:00Z"}, {"title": "SO Upvote Question", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["http"], "author": "helpful_user", "score": 7, "answers": 0, "views": 12}, {"title": "How does React state update?", "body": "React state updates and rendering examples.", "tags": ["javascript"], "author": "helpful_user", "score": 2, "answers": [{"body": "Batch state updates safely.", "author": "activity_user", "score": 5, "accepted": true}], "views": 18, "asked": "2026-07-20T10:00:00Z", "modified": "2026-07-20T11:00:00Z"}, {"title": "SO Python Unanswered Recent", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["python"], "author": "helpful_user", "score": 0, "answers": 0, "views": 5, "asked": "2026-07-20T12:00:00Z", "modified": "2026-07-20T12:00:00Z"}, {"title": "SO Python Answered Active", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["python"], "author": "helpful_user", "score": 4, "answers": 1, "views": 10, "asked": "2026-07-19T12:00:00Z", "modified": "2026-07-21T11:00:00Z"}]}
        When: Follow Questions in Main navigation.
        Then: Question feed exposes Ask Question and published question summaries.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
    dependencies: []
  - id: REQ-3.2
    name: Read question detail
    description:
      text: Selecting "How can I safely retry an idempotent HTTP request in Node.js?"(role=button) from the feed
        opens that question's heading and "Question post"(role=region), with its rendered source body, node.js/http/retry
        tags, Ask Question entry, numeric "Score"(role=status), and "Up vote"(role=button), "Down vote"(role=button),
        "Save"(role=button), "Timeline"(role=button), "Share"(role=button), "Edit"(role=button), and "Follow"(role=button)
        controls. "Asked"(role=status) and "Modified"(role=status) display shared examples timestamps or an unambiguous
        UTC equivalent; "View count"(role=status) is at least the initial 42 because opening may increase views.
        "Author"(role=region) shows Helpful User's identity, avatar, initial reputation, current badges, and time.
        Authenticated users also see Comments with "Add a comment"(role=button). Feed tags, score, and answer count
        agree with the detail. Unrequested Share, Follow, and Timeline behavior is not invented.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-3.2-01
      name: Read a published question
      steps:
      - id: STEP-REQ-3.2-01-01
        Given: |-
          Authenticate stack_user and use public Search to open the seeded retry question, whose score is 7, initial views 42, Asked July 1 and Modified July 10, with Helpful User as author.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
          - public historical question index: {"questions": [{"title": "How can I safely retry an idempotent HTTP request in Node.js?", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["node.js", "http", "retry"], "author": "helpful_user", "score": 7, "answers": 0, "views": 42, "asked": "2026-07-01T12:00:00Z", "modified": "2026-07-10T12:00:00Z"}]}
        When: Inspect the heading, Question post, named Asked/Modified/View count outputs, tags, vote/save/timeline/share/edit/follow
          controls, Author information and Comments entry.
        Then: The exact heading and seeded rendered body appear with node.js/http/retry tags, Score 7, correct UTC
          Asked and Modified dates and View count at least 42. Author shows Helpful User, avatar, numeric reputation,
          badges and time; authenticated Comments offers Add a comment. All declared post actions are visible.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
    dependencies:
    - REQ-3.1
    - REQ-6.1
  - id: REQ-3.3
    name: Publish a question
    description:
      text: A signed-in user clicks "Ask Question"(role=button), enters "Title"(role=textbox) with at least 15 characters
        and "Body"(role=textbox) with at least 220 characters, and selects at least one tag through "Tags"(role=textbox).
        Markdown renders live in "Preview"(role=region), while "Title character count"(role=status) shows the title
        length. Entering node.js displays "Suggestions"(role=region) including node.js, http, and retry; the tag
        input accepts comma-separated selected names. "Post Your Question"(role=button) publishes the entered title,
        body, and tags, opens their detail,. Missing or insufficient inputs show Title is required (minimum 15 characters),
        Question body is required (minimum 220 characters), or Please add at least one tag as applicable, retaining
        the editor without publishing. No upper tag-count limit is invented.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-ASK-QUESTION-PAGE
        reference: reference/ask-question-page.jpeg
        page: question_editor
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-3.3-01
      name: Publish with preview and tags
      steps:
      - id: STEP-REQ-3.3-01-01
        Given: |-
          Authenticate question_creator with no question having the isolated How can I safely retry an idempotent HTTP request in Node.js without duplicating side effects? title; the shared UI-created examples supplies a valid body longer than 220 characters.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"question_creator": {"email": "question_creator@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
        When: Click Ask Question in Question feed, fill Title with that isolated title and Body with Markdown Retry
          safety followed by the shared example body; inspect Title character count and Preview. Enter node.js in
          Tags to inspect suggestions, then enter node.js,http,retry and Post Your Question.
        Then: The entered title heading, rendered body and node.js/http/retry tag actions are visible on the saved
          question detail.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-ASK-QUESTION-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-3.3-02
      name: Reject missing required fields
      steps:
      - id: STEP-REQ-3.3-02-01
        Given: |-
          Authenticate question_creator and open an empty Ask Question editor with no current draft published.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"question_creator": {"email": "question_creator@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
        When: Click Post Your Question with all fields empty; enter a valid isolated title and submit again with
          Body empty; enter the valid shared example body and submit again with Tags empty.
        Then: Each stage shows the corresponding exact Title is required (minimum 15 characters), Question body
          is required (minimum 220 characters), or Please add at least one tag message. The editor remains available
          and no Question post is published.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-ASK-QUESTION-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-3.3-03
      name: Reject too-short title and body
      steps:
      - id: STEP-REQ-3.3-03-01
        Given: |-
          Authenticate question_creator and open Ask Question with a valid shared example body and http tag available.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"question_creator": {"email": "question_creator@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
        When: Enter the 14-character title 12345678901234 with valid Body and Tags and submit; replace it with a
          valid isolated title, set Body to 219 a characters and submit again.
        Then: The first submission shows the minimum-15 title error and the second the minimum-220 body error; Body
          remains editable and no Question post is published.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-ASK-QUESTION-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
    dependencies:
    - REQ-2.1
    - REQ-3.1
  - id: REQ-3.4
    name: Revise a question
    description:
      text: The owner clicks Edit in Question post to open Title, Body and Tags prefilled from that question, and
        Edit Summary for a reason. Save edits updates that same question, displays edited metadata and records the
        reason and old/new body under Timeline → Revision history (region). Tags removed in an edit are absent from
        the saved post. Rich editor toolbar, revision selection and edit cancellation are outside scope.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-EDIT-QUESTION
        reference: reference/edit-question.jpeg
        page: question_editor
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.4-01
      name: Save revision and summary
      steps:
      - id: STEP-REQ-3.4-01-01
        Given: |-
          UI-create isolated SO Question Edit Save under question_editor with shared example body and node.js,http,retry, then authenticate its owner and open Edit.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"question_editor": {"email": "question_editor@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
        When: Append clarified to Title and Include bounded retry budgets. to Body, set Tags to http,retry and Edit
          Summary to Fixed a typo in the second paragraph; Save edits and open Timeline.
        Then: The detail shows the replacement heading and body, edited metadata and only http/retry tags. Revision
          history contains the summary and both original and replacement body values.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-3.2)
