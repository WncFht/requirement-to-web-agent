exclude: ^(input/|examples/|acceptance/|coding_agent/support/shared/project/templates/|compiler/|\.agents/notes/archived/)
repos:
  - repo: local
    hooks:
      - id: markdown-lint
        name: Fix changed Markdown style
        entry: node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
      - id: document-format
        name: Format staged documents and configuration
        entry: node_modules/.bin/git-format-staged -f 'node_modules/.bin/prettier --stdin-filepath {}'
        language: system
        types_or: [markdown, json, yaml]
      - id: python-format
        name: Format staged Python
        entry: node_modules/.bin/git-format-staged -f 'ruff format --stdin-filename {} -'
        language: system
        types: [python]
      - id: maintenance-index
        name: Check staged documentation and decisions
        entry: .venv/bin/python scripts/staged_checks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: compiler-tests
        name: Compiler unit tests
        entry: .venv/bin/python -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        types: [python]
      - id: python-safety
        name: Check Python syntax and undefined names
        entry: ruff check
        language: system
        types: [python]
      - id: secrets
        name: Check staged source for credentials
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
