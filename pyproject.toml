[project]
name = "requirement-compilation-structure"
version = "0.1.0"
description = "Compile a requirement tree into a database, backend APIs, and an interactive frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "openai",
    "python-dotenv",
    "jsonschema>=4,<5",
    "httpx",
    "playwright>=1.64.1",
]

[tool.uv]
package = false

[tool.ruff.lint]
# This independent teacher-code repository keeps its unittest conventions.
# Add syntax/undefined-name checks without rewriting frozen teaching sources.
select = ["E9", "F63", "F7", "F82"]
